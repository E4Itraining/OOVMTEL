# =============================================================================
# Kafka MirrorMaker 2 Configuration - OT to IT Replication
# =============================================================================
# SECURITY: Unidirectional replication ONLY (OT → IT)
# IEC 62443 compliant - simulates data diode behavior
# =============================================================================

# Cluster aliases
clusters = ot, it

# OT Cluster (Source)
ot.bootstrap.servers = kafka-ot:9092
ot.consumer.group.id = mm2-ot-consumer

# IT Cluster (Target)
it.bootstrap.servers = kafka-it:9092
it.producer.compression.type = lz4
it.producer.acks = all
it.producer.retries = 3

# =============================================================================
# REPLICATION RULES - UNIDIRECTIONAL ONLY
# =============================================================================

# Enable OT → IT replication
ot->it.enabled = true

# SECURITY: Disable IT → OT replication (data diode behavior)
it->ot.enabled = false

# Topics to replicate from OT to IT
ot->it.topics = ot-telemetry-export, dmz-validated-telemetry, ot-scada-raw, ot-mes-raw, ot-plm-raw, ot-opcua-raw

# Topic renaming: add "it-" prefix for IT zone
replication.policy.class = org.apache.kafka.connect.mirror.DefaultReplicationPolicy
replication.policy.separator = .

# Custom topic mapping
ot->it.topics.rename.format = it-${topic}

# =============================================================================
# CONNECTOR SETTINGS
# =============================================================================

# Source connector (reads from OT)
source.cluster.alias = ot
target.cluster.alias = it

# Replication factor for checkpoints and offsets
checkpoints.topic.replication.factor = 3
heartbeats.topic.replication.factor = 3
offset-syncs.topic.replication.factor = 3

# Consumer settings
source.consumer.auto.offset.reset = latest
source.consumer.max.poll.records = 1000

# Producer settings
producer.batch.size = 65536
producer.linger.ms = 10
producer.buffer.memory = 67108864

# =============================================================================
# SYNC SETTINGS
# =============================================================================

# Offset sync (for consumer group migration if needed)
sync.group.offsets.enabled = true
sync.group.offsets.interval.seconds = 60

# Heartbeat for monitoring
emit.heartbeats.enabled = true
emit.heartbeats.interval.seconds = 10

# Checkpoints for exactly-once semantics
emit.checkpoints.enabled = true
emit.checkpoints.interval.seconds = 60

# =============================================================================
# MONITORING
# =============================================================================

# JMX metrics
metric.reporters = org.apache.kafka.common.metrics.JmxReporter

# Refresh interval for topic list
refresh.topics.interval.seconds = 30
refresh.groups.interval.seconds = 60

# =============================================================================
# SECURITY NOTES
# =============================================================================
#
# This configuration implements a software data diode:
# 1. OT → IT replication is ENABLED
# 2. IT → OT replication is DISABLED
# 3. No bidirectional sync
#
# For production NIS2/IEC 62443 compliance:
# - Consider hardware data diode for critical installations
# - Enable TLS/SSL between clusters
# - Add SASL authentication
# - Implement network-level firewall rules
# =============================================================================
