# Kafka Broker Configuration for Industrial Observability Platform
# Optimized for high-volume IT/OT streaming

############################# Server Basics #############################
broker.id=1
listeners=PLAINTEXT://0.0.0.0:9092
advertised.listeners=PLAINTEXT://kafka:9092
listener.security.protocol.map=PLAINTEXT:PLAINTEXT

############################# Log Basics #############################
log.dirs=/var/lib/kafka/data
num.partitions=12
default.replication.factor=1
min.insync.replicas=1

############################# Log Retention Policy #############################
# Retain logs for 24 hours (suitable for buffering industrial data)
log.retention.hours=24
log.retention.bytes=10737418240
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000

############################# Performance Tuning #############################
# Optimized for high-throughput industrial streaming
num.network.threads=8
num.io.threads=16
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600

# Batch settings for high volume
batch.size=65536
linger.ms=5
compression.type=lz4

############################# Zookeeper #############################
zookeeper.connect=zookeeper:2181
zookeeper.connection.timeout.ms=18000

############################# Group Coordinator Settings #############################
group.initial.rebalance.delay.ms=3000
