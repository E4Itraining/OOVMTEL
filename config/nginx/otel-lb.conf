# =============================================================================
# Nginx Load Balancer Configuration - OTel Collectors IT
# =============================================================================
# High Availability load balancing for OTel Collector instances
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

# TCP/UDP stream for gRPC and other protocols
stream {
    # Logging
    log_format stream_log '$remote_addr [$time_local] '
                          '$protocol $status $bytes_sent $bytes_received '
                          '$session_time "$upstream_addr"';

    access_log /var/log/nginx/stream_access.log stream_log;

    # ==========================================================================
    # OTLP gRPC (port 4317)
    # ==========================================================================
    upstream otel_grpc {
        least_conn;
        server otel-collector-it-1:4317 weight=1 max_fails=3 fail_timeout=30s;
        server otel-collector-it-2:4317 weight=1 max_fails=3 fail_timeout=30s backup;
    }

    server {
        listen 4317;
        proxy_pass otel_grpc;
        proxy_connect_timeout 10s;
        proxy_timeout 300s;

        # Health check passthrough
        proxy_next_upstream on;
        proxy_next_upstream_timeout 10s;
        proxy_next_upstream_tries 2;
    }

    # ==========================================================================
    # Prometheus Metrics (port 8888)
    # ==========================================================================
    upstream otel_metrics {
        # Round robin for metrics scraping
        server otel-collector-it-1:8888 weight=1;
        server otel-collector-it-2:8888 weight=1;
    }

    server {
        listen 8888;
        proxy_pass otel_metrics;
        proxy_connect_timeout 5s;
        proxy_timeout 30s;
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream: $upstream_addr rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_types application/json application/x-protobuf;

    # ==========================================================================
    # OTLP HTTP (port 4318)
    # ==========================================================================
    upstream otel_http {
        least_conn;
        server otel-collector-it-1:4318 weight=1 max_fails=3 fail_timeout=30s;
        server otel-collector-it-2:4318 weight=1 max_fails=3 fail_timeout=30s;

        keepalive 32;
    }

    server {
        listen 4318;
        server_name _;

        # Large body for telemetry data
        client_max_body_size 16m;
        client_body_buffer_size 1m;

        location / {
            proxy_pass http://otel_http;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_timeout 10s;
            proxy_next_upstream_tries 2;
        }
    }

    # ==========================================================================
    # Health Check Endpoint (port 13133)
    # ==========================================================================
    upstream otel_health {
        server otel-collector-it-1:13133 weight=1;
        server otel-collector-it-2:13133 weight=1;
    }

    server {
        listen 13133;
        server_name _;

        location /health {
            proxy_pass http://otel_health/health;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        # Aggregate health status
        location / {
            default_type application/json;
            return 200 '{"status": "healthy", "load_balancer": "nginx", "backends": 2}';
        }
    }
}
