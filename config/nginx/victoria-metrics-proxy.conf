# =============================================================================
# Nginx Proxy Configuration - VictoriaMetrics Cluster
# =============================================================================
# Provides backward compatibility with single-node API
# Routes write to vminsert, read to vmselect
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent rt=$request_time '
                    'upstream: $upstream_addr';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip for Prometheus responses
    gzip on;
    gzip_types application/json text/plain;

    # ==========================================================================
    # Upstreams
    # ==========================================================================

    # vminsert for writes
    upstream vminsert {
        server vminsert:8480;
        keepalive 16;
    }

    # vmselect for reads
    upstream vmselect {
        server vmselect:8481;
        keepalive 16;
    }

    # ==========================================================================
    # Main Server - Port 8428 (backward compatible)
    # ==========================================================================
    server {
        listen 8428;
        server_name _;

        client_max_body_size 64m;
        client_body_buffer_size 4m;

        # Health check
        location /health {
            proxy_pass http://vmselect/health;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        # Write endpoints → vminsert
        location /api/v1/write {
            proxy_pass http://vminsert/insert/0/prometheus/api/v1/write;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location /api/v1/import {
            proxy_pass http://vminsert/insert/0/prometheus$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # Read endpoints → vmselect
        location /api/v1/query {
            proxy_pass http://vmselect/select/0/prometheus$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
        }

        location /api/v1/query_range {
            proxy_pass http://vmselect/select/0/prometheus$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
        }

        location /api/v1/series {
            proxy_pass http://vmselect/select/0/prometheus$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        location /api/v1/labels {
            proxy_pass http://vmselect/select/0/prometheus$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
        }

        location /api/v1/label/ {
            proxy_pass http://vmselect/select/0/prometheus$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
        }

        # Grafana datasource compatibility
        location /prometheus/ {
            rewrite ^/prometheus/(.*)$ /select/0/prometheus/$1 break;
            proxy_pass http://vmselect;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 120s;
        }

        # Default: route to vmselect
        location / {
            proxy_pass http://vmselect/select/0/prometheus$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
        }
    }
}
