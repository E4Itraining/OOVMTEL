# =============================================================================
# OpenSearch Dashboards Configuration
# Modern, Responsive Log Analytics for Industrial Observability
# =============================================================================

# Server configuration
server.host: "0.0.0.0"
server.port: 5601
server.name: "oovmtel-opensearch-dashboards"

# OpenSearch connection
opensearch.hosts: ["http://opensearch:9200"]
opensearch.ssl.verificationMode: none
opensearch.requestTimeout: 60000
opensearch.shardTimeout: 30000

# NOTE: Security plugin is disabled via DISABLE_SECURITY_DASHBOARDS_PLUGIN env var
# Do NOT add opensearch_security.* settings when security is disabled

# Logging configuration
logging.dest: stdout
logging.verbose: false

# Branding and UI customization
opensearchDashboards.branding:
  logo:
    defaultUrl: ""
  mark:
    defaultUrl: ""
  loadingLogo:
    defaultUrl: ""
  faviconUrl: ""
  applicationTitle: "OOVMTEL Log Analytics"

# Data management
data.search.usageTelemetry.enabled: false

# Request headers (using non-deprecated key)
opensearch.requestHeadersAllowlist: ["Authorization"]
