# =============================================================================
# Grafana Configuration for OOVMTEL Platform
# Modern, Responsive Industrial Observability Dashboards
# =============================================================================

[server]
protocol = http
http_port = 3000
domain = localhost
root_url = %(protocol)s://%(domain)s:%(http_port)s/

[database]
type = sqlite3

[session]
provider = file

[security]
admin_user = admin
admin_password = admin123
allow_embedding = true
cookie_secure = false
cookie_samesite = lax

[users]
allow_sign_up = false
auto_assign_org = true
auto_assign_org_role = Viewer
default_theme = dark

[auth]
disable_login_form = false

[auth.anonymous]
enabled = true
org_name = Main Org.
org_role = Viewer

[paths]
data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[dashboards]
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/json/welcome-hub.json

[unified_alerting]
enabled = true

[alerting]
enabled = false

[explore]
enabled = true

[feature_toggles]
enable = publicDashboards

[panels]
disable_sanitize_html = false

[plugins]
allow_loading_unsigned_plugins = victoriametrics-metrics-datasource

[live]
max_connections = 100
allowed_origins = *

[log]
mode = console
level = info

[log.console]
format = text

[analytics]
reporting_enabled = false
check_for_updates = false

[news]
news_feed_enabled = false

# =============================================================================
# Modern Theme Configuration
# =============================================================================
[date_formats]
default_timezone = browser
full_date = YYYY-MM-DD HH:mm:ss
interval_second = HH:mm:ss
interval_minute = HH:mm
interval_hour = MM/DD HH:mm
interval_day = MM/DD
interval_month = YYYY-MM
interval_year = YYYY

[dataproxy]
timeout = 60
keep_alive_seconds = 30
