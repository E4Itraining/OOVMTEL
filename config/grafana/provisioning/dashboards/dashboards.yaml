# Grafana Dashboard Provisioning Configuration
apiVersion: 1

providers:
  - name: 'Industrial Observability'
    orgId: 1
    folder: 'Industrial'
    folderUid: 'industrial'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
