# =============================================================================
# OOVMTEL - Industrial Observability Platform
# OpenObserve + VictoriaMetrics + OpenTelemetry + OpenSearch + Kafka
# Optimized for high-volume IT/OT data streaming
# =============================================================================

services:
  # ===========================================================================
  # KAFKA - Message Buffer KRaft mode (no Zookeeper)
  # ===========================================================================

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: oovmtel-kafka
    hostname: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      # KRaft mode configuration (single node)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      CLUSTER_ID: MkU3OEVBNTcyNTRTNDYzNw
      # Listener configuration
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://kafka:9094,INTERNAL://kafka:9092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Single-node settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Performance tuning for high volume
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_BYTES: 10737418240
      KAFKA_COMPRESSION_TYPE: lz4
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      KAFKA_REPLICA_FETCH_MAX_BYTES: 10485760
      # JVM tuning
      KAFKA_HEAP_OPTS: "-Xmx2g -Xms2g"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - oovmtel-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 2>/dev/null || exit 1"]
      interval: 20s
      timeout: 20s
      retries: 15
      start_period: 90s
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: oovmtel-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: oovmtel-main
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_READONLY: "false"
      # Modern UI Settings
      DYNAMIC_CONFIG_ENABLED: "true"
      AUTH_TYPE: "DISABLED"
      # Performance settings
      WEBCLIENT_MAX_IN_MEMORY_BUFFER_SIZE: "20MB"
    volumes:
      - ./config/kafka-ui/config.yml:/etc/kafkaui/dynamic_config.yaml:ro
    networks:
      - oovmtel-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  kafka-init:
    image: confluentinc/cp-kafka:7.5.3
    container_name: oovmtel-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo 'Creating Kafka topics for industrial data...'

        # SCADA metrics topic - high throughput
        kafka-topics --create --if-not-exists --topic scada-metrics --bootstrap-server kafka:9092 --partitions 12 --replication-factor 1 --config retention.ms=86400000 --config compression.type=lz4

        # MES events topic
        kafka-topics --create --if-not-exists --topic mes-events --bootstrap-server kafka:9092 --partitions 8 --replication-factor 1 --config retention.ms=86400000

        # PLM data topic
        kafka-topics --create --if-not-exists --topic plm-data --bootstrap-server kafka:9092 --partitions 4 --replication-factor 1 --config retention.ms=172800000

        # OPC-UA nodes topic
        kafka-topics --create --if-not-exists --topic opcua-nodes --bootstrap-server kafka:9092 --partitions 8 --replication-factor 1 --config retention.ms=86400000

        # Industrial telemetry (OTLP)
        kafka-topics --create --if-not-exists --topic industrial-telemetry --bootstrap-server kafka:9092 --partitions 12 --replication-factor 1 --config retention.ms=86400000

        # Processed telemetry output
        kafka-topics --create --if-not-exists --topic processed-telemetry --bootstrap-server kafka:9092 --partitions 6 --replication-factor 1 --config retention.ms=172800000

        echo 'Kafka topics created successfully!'
        kafka-topics --list --bootstrap-server kafka:9092
    networks:
      - oovmtel-network

  # ===========================================================================
  # DATA INGESTION LAUNCHER - Initializes data flow at startup
  # ===========================================================================

  data-ingestion-launcher:
    image: confluentinc/cp-kafka:7.5.3
    container_name: oovmtel-data-ingestion-launcher
    depends_on:
      kafka:
        condition: service_healthy
      victoria-metrics:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      openobserve:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      VICTORIA_METRICS_URL: http://victoria-metrics:8428
      OPENSEARCH_URL: http://opensearch:9200
      OPENOBSERVE_URL: http://openobserve:5080
      OTEL_COLLECTOR_URL: http://otel-collector:13133
      MAX_RETRIES: 60
      RETRY_INTERVAL: 5
      KEEP_RUNNING: "false"
    volumes:
      - ./scripts/data-ingestion-launcher.sh:/usr/local/bin/data-ingestion-launcher.sh:ro
    entrypoint: ["/bin/bash", "/usr/local/bin/data-ingestion-launcher.sh"]
    networks:
      - oovmtel-network
    restart: "no"

  # ===========================================================================
  # VICTORIA METRICS - High-Performance Time Series Database
  # ===========================================================================

  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.96.0
    container_name: oovmtel-victoria-metrics
    ports:
      - "8428:8428"
    command:
      - "-storageDataPath=/victoria-metrics-data"
      - "-httpListenAddr=:8428"
      - "-retentionPeriod=90d"
      # Performance tuning for high volume
      - "-search.maxConcurrentRequests=32"
      - "-search.maxQueueDuration=30s"
      - "-search.maxUniqueTimeseries=1000000"
      - "-search.maxSamplesPerSeries=100000000"
      - "-search.maxSamplesPerQuery=1000000000"
      # Memory settings
      - "-memory.allowedPercent=80"
      # Ingestion settings
      - "-maxLabelsPerTimeseries=40"
      - "-maxLabelValueLen=1024"
      # Deduplication
      - "-dedup.minScrapeInterval=10s"
    volumes:
      - victoria_metrics_data:/victoria-metrics-data
    networks:
      - oovmtel-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8428/health 2>/dev/null | grep -q 'OK' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    restart: unless-stopped

  vmagent:
    image: victoriametrics/vmagent:v1.96.0
    container_name: oovmtel-vmagent
    depends_on:
      victoria-metrics:
        condition: service_healthy
      scada-simulator:
        condition: service_healthy
      mes-simulator:
        condition: service_healthy
      plm-simulator:
        condition: service_healthy
      opcua-simulator:
        condition: service_healthy
    ports:
      - "8429:8429"
    command:
      - "-promscrape.config=/etc/vmagent/vmagent.yaml"
      - "-remoteWrite.url=http://victoria-metrics:8428/api/v1/write"
      - "-remoteWrite.tmpDataPath=/tmp/vmagent"
      # Performance tuning
      - "-remoteWrite.maxDiskUsagePerURL=1GB"
      - "-remoteWrite.queues=16"
      - "-remoteWrite.maxBlockSize=32MB"
    volumes:
      - ./config/victoria-metrics/vmagent.yaml:/etc/vmagent/vmagent.yaml:ro
      - vmagent_data:/tmp/vmagent
    networks:
      - oovmtel-network
    restart: unless-stopped

  # ===========================================================================
  # OPENOBSERVE - Logs, Metrics, Traces (All-in-One)
  # ===========================================================================

  openobserve:
    image: openobserve/openobserve:v0.10.1
    container_name: oovmtel-openobserve
    ports:
      - "5080:5080"
      - "5081:5081"
    environment:
      ZO_ROOT_USER_EMAIL: "root@example.com"
      ZO_ROOT_USER_PASSWORD: "Complexpass#123"
      ZO_DATA_DIR: "/data"
      # Performance settings - reduced for faster startup
      ZO_MAX_FILE_SIZE_ON_DISK: 64
      ZO_MAX_FILE_RETENTION_TIME: 600
      ZO_COMPACT_ENABLED: "true"
      ZO_COMPACT_INTERVAL: 120
      ZO_MEMORY_CACHE_ENABLED: "true"
      ZO_MEMORY_CACHE_MAX_SIZE: 512
      # OTEL settings
      ZO_OTEL_ENABLED: "true"
      ZO_PROMETHEUS_ENABLED: "true"
      # Telemetry
      ZO_TELEMETRY: "false"
      # HTTP settings for faster startup
      ZO_HTTP_PORT: "5080"
      # Local mode for single-node setup (faster initialization)
      ZO_LOCAL_MODE: "true"
      # Reduce initial resource usage
      ZO_COMPACT_MAX_FILE_SIZE: 64
      ZO_WAL_MEMORY_MODE_ENABLED: "false"
      # Logging for debugging
      RUST_LOG: "info"
    volumes:
      - openobserve_data:/data
    networks:
      - oovmtel-network
    healthcheck:
      # Simple port check - most reliable during startup
      test: ["CMD-SHELL", "nc -z localhost 5080 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  # ===========================================================================
  # OPENSEARCH - Full-Text Search and Analytics
  # ===========================================================================

  opensearch:
    image: opensearchproject/opensearch:2.11.1
    container_name: oovmtel-opensearch
    environment:
      - cluster.name=oovmtel-cluster
      - node.name=opensearch-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g"
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
      - ./config/opensearch/opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
    ports:
      - "9200:9200"
      - "9600:9600"
    networks:
      - oovmtel-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.1
    container_name: oovmtel-opensearch-dashboards
    depends_on:
      opensearch:
        condition: service_healthy
    ports:
      - "5601:5601"
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
      # Modern UI Settings
      SERVER_NAME: "oovmtel-opensearch-dashboards"
      SERVER_HOST: "0.0.0.0"
      # Performance settings
      OPENSEARCH_REQUESTTIMEOUT: "60000"
    volumes:
      - ./config/opensearch-dashboards/opensearch_dashboards.yml:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml:ro
      - ./config/opensearch-dashboards/saved-objects.ndjson:/usr/share/opensearch-dashboards/config/saved-objects.ndjson:ro
    networks:
      - oovmtel-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q '\"overall\":{\"state\":\"green\"\\|\"level\":\"available\"' || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ===========================================================================
  # OPENTELEMETRY COLLECTOR - Central Telemetry Pipeline
  # ===========================================================================

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.91.0
    container_name: oovmtel-otel-collector
    depends_on:
      kafka:
        condition: service_healthy
      victoria-metrics:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      openobserve:
        condition: service_started
      scada-simulator:
        condition: service_healthy
      mes-simulator:
        condition: service_healthy
      plm-simulator:
        condition: service_healthy
      opcua-simulator:
        condition: service_healthy
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Prometheus metrics
      - "13133:13133" # Health check
      - "55679:55679" # zPages
    environment:
      # Use GOMEMLIMIT instead of deprecated memory_ballast extension
      GOMEMLIMIT: 1750MiB
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./config/otel/otel-collector-config.yaml:/etc/otel/config.yaml:ro
      - industrial_logs:/var/log/industrial
    networks:
      - oovmtel-network
    healthcheck:
      # Simple port check - more reliable during startup when config is still loading
      test: ["CMD-SHELL", "nc -z localhost 13133 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  # ===========================================================================
  # GRAFANA - Visualization and Dashboards
  # ===========================================================================

  grafana:
    image: grafana/grafana:10.2.3
    container_name: oovmtel-grafana
    depends_on:
      - victoria-metrics
      - opensearch
    ports:
      - "3000:3000"
    environment:
      # Core settings
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
      # Plugin configuration
      - GF_INSTALL_PLUGINS=grafana-opensearch-datasource,victoriametrics-metrics-datasource,grafana-clock-panel,grafana-piechart-panel
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=victoriametrics-metrics-datasource
      # Modern UI Settings
      - GF_USERS_DEFAULT_THEME=dark
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/json/industrial-control-center.json
      # Performance and features
      - GF_FEATURE_TOGGLES_ENABLE=publicDashboards
      - GF_LIVE_MAX_CONNECTIONS=100
      - GF_LIVE_ALLOWED_ORIGINS=*
      # Disable analytics
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_NEWS_NEWS_FEED_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
    networks:
      - oovmtel-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ===========================================================================
  # UNIFIED VIEW WEB APPLICATION
  # ===========================================================================

  unified-view:
    build:
      context: ./web-app
      dockerfile: Dockerfile
    container_name: oovmtel-unified-view
    depends_on:
      - victoria-metrics
      - opensearch
      - grafana
    ports:
      - "8085:8080"
    environment:
      VICTORIA_METRICS_URL: http://victoria-metrics:8428
      OPENSEARCH_URL: http://opensearch:9200
      KAFKA_URL: kafka:9092
      OPENOBSERVE_URL: http://openobserve:5080
      OTEL_COLLECTOR_URL: http://otel-collector:8888
      GRAFANA_URL: http://grafana:3000
      REFRESH_INTERVAL: "10"
      USE_SIMULATED_DATA: "true"
      # Game-Changer Modules Configuration
      MODULES_ENABLED: "true"
      # NLP Module
      NLP_DEFAULT_LANGUAGE: "fr"
      # Remediation Module
      REMEDIATION_DRY_RUN: "true"
      REMEDIATION_REQUIRE_APPROVAL: "true"
      # Edge Module
      EDGE_SYNC_INTERVAL: "60"
      # Predictive Module
      PREDICTIVE_ANOMALY_SENSITIVITY: "2.0"
    networks:
      - oovmtel-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ===========================================================================
  # INDUSTRIAL DATA SIMULATORS
  # ===========================================================================

  scada-simulator:
    build:
      context: ./simulators
      dockerfile: Dockerfile
    container_name: oovmtel-scada-simulator
    hostname: scada-simulator
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_ENDPOINT: http://otel-collector:4318
      SIMULATOR_TYPE: scada
      METRICS_PORT: 8080
      DATA_RATE_PER_SEC: 500
    ports:
      - "8080:8080"
    networks:
      - oovmtel-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  mes-simulator:
    build:
      context: ./simulators
      dockerfile: Dockerfile
    container_name: oovmtel-mes-simulator
    hostname: mes-simulator
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_ENDPOINT: http://otel-collector:4318
      SIMULATOR_TYPE: mes
      METRICS_PORT: 8081
      DATA_RATE_PER_SEC: 100
    ports:
      - "8081:8081"
    networks:
      - oovmtel-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  plm-simulator:
    build:
      context: ./simulators
      dockerfile: Dockerfile
    container_name: oovmtel-plm-simulator
    hostname: plm-simulator
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_ENDPOINT: http://otel-collector:4318
      SIMULATOR_TYPE: plm
      METRICS_PORT: 8082
      DATA_RATE_PER_SEC: 20
    ports:
      - "8082:8082"
    networks:
      - oovmtel-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  opcua-simulator:
    build:
      context: ./simulators
      dockerfile: Dockerfile
    container_name: oovmtel-opcua-simulator
    hostname: opcua-simulator
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_ENDPOINT: http://otel-collector:4318
      SIMULATOR_TYPE: opcua
      METRICS_PORT: 8083
      DATA_RATE_PER_SEC: 200
    ports:
      - "8083:8083"
    networks:
      - oovmtel-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8083/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

# =============================================================================
# NETWORKS
# =============================================================================

networks:
  oovmtel-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# =============================================================================
# VOLUMES
# =============================================================================

volumes:
  kafka_data:
    driver: local
  victoria_metrics_data:
    driver: local
  vmagent_data:
    driver: local
  openobserve_data:
    driver: local
  opensearch_data:
    driver: local
  grafana_data:
    driver: local
  industrial_logs:
    driver: local
